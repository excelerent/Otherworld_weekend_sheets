<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    .container { padding: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], select, textarea { width: 100%; box-sizing: border-box; }
    textarea { height: 60px; }
    .hidden { display: none; }
    .button-bar { display: flex; justify-content: space-between; margin-top: 10px; }
    #message { margin-top: 10px; padding: 5px; border-radius: 3px; }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
    .plus-btn { 
      background: #4285f4; 
      color: white; 
      border: none; 
      border-radius: 50%; 
      width: 30px; 
      height: 30px; 
      font-size: 20px; 
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h3 id="form-title">New Incident</h3>
      <button id="toggle-btn" class="plus-btn" title="Extend Existing Incident">+</button>
    </div>

    <form id="medical-form">
      <div id="incident-fields">
        <div class="form-group">
          <label for="personName">Person Involved</label>
          <input type="text" id="personName" name="personName" required>
        </div>
        <div class="form-group">
          <label for="party">Party (if participant)</label>
          <select id="party" name="party">
            <option value="">-- Non-Participant --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <input type="text" id="role" name="role">
        </div>
        <div class="form-group">
          <label for="chiefComplaint">Chief Complaint (1-5 words)</label>
          <input type="text" id="chiefComplaint" name="chiefComplaint" required>
        </div>
      </div>

      <div id="extension-header" class="hidden">
        <div class="form-group">
          <label>Target Incident Sheet:</label>
          <div id="target-sheet-display" style="font-style: italic; color: #666;"></div>
          <input type="hidden" id="targetSheetName" name="targetSheetName">
        </div>
      </div>

      <hr>
      <h4>Action Log Entry</h4>
      
      <div class="form-group">
        <label for="presided">Who presided?</label>
        <select id="presided" name="presided" required>
          <option value="">-- Select Staff --</option>
        </select>
      </div>
      <div class="form-group">
        <label for="situation">Situation</label>
        <textarea id="situation" name="situation"></textarea>
      </div>
      <div class="form-group">
        <label for="actionsTaken">Actions Taken (list)</label>
        <textarea id="actionsTaken" name="actionsTaken"></textarea>
      </div>
      <div class="form-group">
        <label for="recommendations">Future Recommendations</label>
        <textarea id="recommendations" name="recommendations"></textarea>
      </div>

      <div class="button-bar">
        <button type="submit" class="action" id="submit-btn">Create Incident</button>
        <button type="button" onclick="resetForm()">Clear</button>
      </div>
    </form>
    
    <div id="message"></div>
  </div>

  <script>
    let isExtensionMode = false;

    // Load form data (parties and staff)
    google.script.run.withSuccessHandler(function(data) {
      const partySelect = document.getElementById('party');
      data.parties.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        partySelect.appendChild(opt);
      });

      const presidedSelect = document.getElementById('presided');
      data.staff.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        presidedSelect.appendChild(opt);
      });
    }).getFormData();

    document.getElementById('toggle-btn').onclick = function() {
      isExtensionMode = !isExtensionMode;
      const incidentFields = document.getElementById('incident-fields');
      const extensionHeader = document.getElementById('extension-header');
      const submitBtn = document.getElementById('submit-btn');
      const formTitle = document.getElementById('form-title');
      const toggleBtn = document.getElementById('toggle-btn');

      if (isExtensionMode) {
        google.script.run.withSuccessHandler(function(sheetName) {
          google.script.run.withSuccessHandler(function(isIncident) {
            if (isIncident) {
              incidentFields.classList.add('hidden');
              extensionHeader.classList.remove('hidden');
              document.getElementById('target-sheet-display').textContent = sheetName;
              document.getElementById('targetSheetName').value = sheetName;
              submitBtn.textContent = 'Add Entry';
              formTitle.textContent = 'Extend Incident';
              toggleBtn.textContent = '×';
              toggleBtn.title = 'Back to New Incident';
              
              // Remove required attributes for new incident fields
              document.getElementById('personName').required = false;
              document.getElementById('chiefComplaint').required = false;
            } else {
              showMessage('Please select an Incident sheet first.', 'error');
              isExtensionMode = false;
            }
          }).isIncidentSheet(sheetName);
        }).getCurrentSheetName();
      } else {
        incidentFields.classList.remove('hidden');
        extensionHeader.classList.add('hidden');
        submitBtn.textContent = 'Create Incident';
        formTitle.textContent = 'New Incident';
        toggleBtn.textContent = '+';
        toggleBtn.title = 'Extend Existing Incident';
        
        document.getElementById('personName').required = true;
        document.getElementById('chiefComplaint').required = true;
      }
    };

    document.getElementById('medical-form').onsubmit = function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      showMessage('Processing...', '');

      const formData = {
        personName: document.getElementById('personName').value,
        party: document.getElementById('party').value,
        role: document.getElementById('role').value,
        chiefComplaint: document.getElementById('chiefComplaint').value,
        presided: document.getElementById('presided').value,
        situation: document.getElementById('situation').value,
        actionsTaken: document.getElementById('actionsTaken').value,
        recommendations: document.getElementById('recommendations').value
      };

      if (isExtensionMode) {
        const sheetName = document.getElementById('targetSheetName').value;
        google.script.run.withSuccessHandler(function() {
          showMessage('Entry added successfully!', 'success');
          btn.disabled = false;
          resetActionLog();
        }).withFailureHandler(function(err) {
          showMessage('Error: ' + err.message, 'error');
          btn.disabled = false;
        }).addEntryToIncident(sheetName, formData);
      } else {
        google.script.run.withSuccessHandler(function(sheetName) {
          showMessage('Incident sheet created: ' + sheetName, 'success');
          btn.disabled = false;
          resetForm();
        }).withFailureHandler(function(err) {
          showMessage('Error: ' + err.message, 'error');
          btn.disabled = false;
        }).createNewIncident(formData);
      }
    };

    function showMessage(msg, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = msg;
      msgDiv.className = type;
    }

    function resetForm() {
      document.getElementById('medical-form').reset();
      showMessage('', '');
    }
    
    function resetActionLog() {
      document.getElementById('situation').value = '';
      document.getElementById('actionsTaken').value = '';
      document.getElementById('recommendations').value = '';
    }
  </script>
</body>
</html>
