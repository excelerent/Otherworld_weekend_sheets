<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    .container { padding: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], select, textarea { width: 100%; box-sizing: border-box; }
    textarea { height: 60px; }
    .hidden { display: none; }
    .button-bar { display: flex; justify-content: space-between; margin-top: 10px; }
    #message { margin-top: 10px; padding: 5px; border-radius: 3px; }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
    .plus-btn { 
      background: #4285f4; 
      color: white; 
      border: none; 
      border-radius: 50%; 
      width: 30px; 
      height: 30px; 
      font-size: 20px; 
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h3 id="form-title">Extend Incident</h3>
    </div>

    <form id="medical-form">
      <div id="extension-header">
        <div class="form-group">
          <label>Target Incident Sheet:</label>
          <div id="target-sheet-display" style="font-style: italic; color: #666;"></div>
          <input type="hidden" id="targetSheetName" name="targetSheetName">
        </div>
      </div>

      <hr>
      <h4>Action Log Entry</h4>
      
      <div class="form-group">
        <label for="presided">Who presided?</label>
        <select id="presided" name="presided" required>
          <option value="">-- Select Staff --</option>
        </select>
      </div>
      <div class="form-group">
        <label for="situation">Situation</label>
        <textarea id="situation" name="situation"></textarea>
      </div>
      <div class="form-group">
        <label for="actionsTaken">Actions Taken (list)</label>
        <textarea id="actionsTaken" name="actionsTaken"></textarea>
      </div>
      <div class="form-group">
        <label for="recommendations">Future Recommendations</label>
        <textarea id="recommendations" name="recommendations"></textarea>
      </div>

      <div class="button-bar">
        <button type="submit" class="action" id="submit-btn">Add Entry</button>
        <button type="button" onclick="resetForm()">Clear</button>
      </div>
    </form>
    
    <div id="message"></div>
  </div>

  <script>
    // Load form data
    google.script.run.withSuccessHandler(function(data) {
      const presidedSelect = document.getElementById('presided');
      data.staff.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        presidedSelect.appendChild(opt);
      });
    }).getFormData();

    function checkCurrentSheet() {
      google.script.run.withSuccessHandler(function(sheetName) {
        google.script.run.withSuccessHandler(function(isIncident) {
          if (isIncident) {
            document.getElementById('target-sheet-display').textContent = sheetName;
            document.getElementById('targetSheetName').value = sheetName;
            document.getElementById('submit-btn').disabled = false;
            showMessage('', '');
          } else {
            document.getElementById('target-sheet-display').textContent = 'Please select an incident sheet.';
            document.getElementById('targetSheetName').value = '';
            document.getElementById('submit-btn').disabled = true;
            showMessage('Select an incident sheet to add entries.', 'error');
          }
        }).isIncidentSheet(sheetName);
      }).getCurrentSheetName();
    }

    // Initial check
    checkCurrentSheet();
    // Re-check periodically or on focus if possible, but for simplicity let's add a refresh button or just rely on manual trigger if needed.
    // Actually, in GAS sidebar, it's better to have a way to refresh.

    document.getElementById('medical-form').onsubmit = function(e) {
      e.preventDefault();
      const sheetName = document.getElementById('targetSheetName').value;
      if (!sheetName) {
        showMessage('No target sheet selected.', 'error');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      showMessage('Processing...', '');

      const formData = {
        presided: document.getElementById('presided').value,
        situation: document.getElementById('situation').value,
        actionsTaken: document.getElementById('actionsTaken').value,
        recommendations: document.getElementById('recommendations').value
      };

      google.script.run.withSuccessHandler(function() {
        showMessage('Entry added successfully!', 'success');
        btn.disabled = false;
        resetActionLog();
      }).withFailureHandler(function(err) {
        showMessage('Error: ' + err.message, 'error');
        btn.disabled = false;
      }).addEntryToIncident(sheetName, formData);
    };

    function showMessage(msg, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = msg;
      msgDiv.className = type;
    }

    function resetForm() {
      document.getElementById('medical-form').reset();
      showMessage('', '');
      checkCurrentSheet();
    }
    
    function resetActionLog() {
      document.getElementById('situation').value = '';
      document.getElementById('actionsTaken').value = '';
      document.getElementById('recommendations').value = '';
    }
  </script>
</body>
</html>
