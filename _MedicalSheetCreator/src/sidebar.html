<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Added: Ensure body doesn't scroll */
    }
    .container { 
      padding: 10px; 
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Prevent container itself from scrolling */
      height: 100vh;    /* Changed from 100% to 100vh to ensure it fills the viewport */
      box-sizing: border-box;
    }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], select, textarea { width: 100%; box-sizing: border-box; }
    textarea { height: 60px; }
    .hidden { display: none; }
    .button-bar { 
      display: flex; 
      justify-content: flex-start; 
      align-items: center; 
      gap: 10px; 
      padding: 10px 0;
      background: white;
      border-top: 1px solid #eee;
      flex-shrink: 0; /* Don't let the button bar shrink */
      flex-wrap: nowrap; 
    }
    #message { margin-top: 5px; padding: 5px; border-radius: 3px; flex-shrink: 0; }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
    .action-btn, .secondary-btn, .close-btn { 
      padding: 7px 10px; 
      font-size: 11px;
      white-space: nowrap;
    }
    .action-btn { 
      background-color: #007bff; 
      color: black; 
      border: 1px solid #007bff; 
      border-radius: 3px; 
      cursor: pointer; 
      font-weight: bold;
    }
    .action-btn:hover { background-color: #0056b3; border-color: #0056b3; }
    .action-btn:active { background-color: #6c757d; border-color: #6c757d; }
    .action-btn:disabled { background-color: #ccc; border-color: #ccc; color: #888; cursor: not-allowed; }
    .plus-btn { 
      background: #4285f4; 
      color: white; 
      border: none; 
      border-radius: 50%; 
      width: 30px; 
      height: 30px; 
      font-size: 20px; 
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .secondary-btn { 
      background-color: white; 
      color: #333;
      border: 1px solid #ccc; 
      border-radius: 3px; 
      cursor: pointer; 
      font-weight: bold;
    }
    .secondary-btn:hover { background-color: #f8f9fa; border-color: #bbb; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 10px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .status-active { background-color: #d4edda; color: #155724; }
    .status-closed { background-color: #f8d7da; color: #721c24; }
    .close-btn { 
      background-color: #fb99a3; 
      color: #121212; 
      border: 1px solid #dc3545; 
      border-radius: 3px; 
      cursor: pointer; 
      font-weight: bold;
    }
    .close-btn:hover { background-color: #c82333; border-color: #bd2130; }
    .close-btn:active { background-color: #6c757d; border-color: #6c757d; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h3 id="form-title">Extend Incident</h3>
      <span id="status-display" class="status-badge hidden">Active</span>
    </div>

    <form id="medical-form" style="display: flex; flex-direction: column; flex: 1;">
      <div id="extension-header">
        <div class="form-group">
          <label for="targetSheetName">Target Incident Sheet:</label>
          <select id="targetSheetName" name="targetSheetName" onchange="onSheetSelectChange()">
            <option value="">-- Select Incident --</option>
          </select>
        </div>
      </div>

      <div id="scrollable-content" style="flex: 1; overflow-y: auto;">
        <hr>
        <h4>Action Log Entry</h4>
        
        <div class="form-group">
          <label for="presided">Who presided?</label>
          <select id="presided" name="presided" required>
            <option value="">-- Select Staff --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Offered Transport to urgent care?</label>
          <div style="display: flex; gap: 10px;">
            <label style="font-weight: normal;"><input type="radio" name="offeredTransport" value="Yes" onclick="toggleTransportWhy()"> Yes</label>
            <label style="font-weight: normal;"><input type="radio" name="offeredTransport" value="No" onclick="toggleTransportWhy()"> No</label>
          </div>
        </div>
        <div id="transport-why-group" class="form-group hidden">
          <label for="transportWhy">If NO: Why?</label>
          <input type="text" id="transportWhy" name="transportWhy">
        </div>
        <div class="form-group">
          <label for="situation">Situation</label>
          <textarea id="situation" name="situation"></textarea>
        </div>
        <div class="form-group">
          <label for="actionsTaken">Actions Taken (list)</label>
          <textarea id="actionsTaken" name="actionsTaken"></textarea>
        </div>
        <div class="form-group">
          <label for="recommendations">Future Recommendations</label>
          <textarea id="recommendations" name="recommendations"></textarea>
        </div>
      </div>

      <div class="button-bar">
        <button type="submit" class="action-btn" id="submit-btn">Add Entry</button>
        <button type="button" class="secondary-btn" onclick="resetForm()">Clear</button>
        <button type="button" id="toggle-status-btn" class="hidden" onclick="handleStatusToggle()">Close Incident</button>
      </div>
    </form>
    
    <div id="message"></div>
  </div>

  <script>
    let allIncidents = [];
    let currentActiveSheetName = "";

    // Load form data
    google.script.run
      .withSuccessHandler(function(data) {
        console.log("Sidebar data received:", data);
        const presidedSelect = document.getElementById('presided');
        const staffList = data.medicalStaff || data.staff;
        staffList.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          presidedSelect.appendChild(opt);
        });
        
        allIncidents = data.incidents;
        updateIncidentDropdown();
      })
      .withFailureHandler(function(err) {
        console.error("Error loading sidebar data:", err);
        showMessage('Error loading data: ' + err.message, 'error');
      })
      .getFormData();

    function updateIncidentDropdown() {
      const select = document.getElementById('targetSheetName');
      const currentValue = select.value;
      select.innerHTML = '<option value="">-- Select Incident --</option>';
      
      const activeIncidents = allIncidents.filter(i => i.status === 'Active');
      const closedIncidents = allIncidents.filter(i => i.status !== 'Active');
      
      activeIncidents.forEach(i => {
        const opt = document.createElement('option');
        opt.value = i.sheetName;
        opt.textContent = `${i.sheetName} (${i.name})`;
        select.appendChild(opt);
      });
      
      if (closedIncidents.length > 0) {
        const separator = document.createElement('option');
        separator.disabled = true;
        separator.textContent = '──────────';
        select.appendChild(separator);
        
        closedIncidents.forEach(i => {
          const opt = document.createElement('option');
          opt.value = i.sheetName;
          opt.textContent = `[CLOSED] ${i.sheetName} (${i.name})`;
          select.appendChild(opt);
        });
      }
      
      if (currentValue && allIncidents.some(i => i.sheetName === currentValue)) {
        select.value = currentValue;
      }
      updateStatusDisplay();
    }

    function onSheetSelectChange() {
      const sheetName = document.getElementById('targetSheetName').value;
      if (sheetName) {
        google.script.run.selectSheet(sheetName);
      }
      updateStatusDisplay();
    }

    function updateStatusDisplay() {
      const sheetName = document.getElementById('targetSheetName').value;
      const statusDisplay = document.getElementById('status-display');
      const toggleBtn = document.getElementById('toggle-status-btn');
      
      const incident = allIncidents.find(i => i.sheetName === sheetName);
      
      if (incident) {
        statusDisplay.textContent = incident.status;
        statusDisplay.className = 'status-badge ' + (incident.status === 'Active' ? 'status-active' : 'status-closed');
        statusDisplay.classList.remove('hidden');
        
        if (incident.status === 'Active') {
          toggleBtn.textContent = 'Close Incident';
          toggleBtn.className = 'close-btn';
        } else {
          toggleBtn.textContent = 'Reopen Incident';
          toggleBtn.className = 'secondary-btn';
        }
        toggleBtn.classList.remove('hidden');
      } else {
        statusDisplay.classList.add('hidden');
        toggleBtn.classList.add('hidden');
      }
    }

    function handleStatusToggle() {
      const sheetName = document.getElementById('targetSheetName').value;
      const incident = allIncidents.find(i => i.sheetName === sheetName);
      if (!incident) return;

      if (incident.status === 'Active') {
        const remark = prompt('Are you sure you want to close this incident?\n\nPlease enter a final remark (optional):');
        if (remark === null) return; // User cancelled prompt
        
        toggleStatus(remark || ""); // Ensure remark is at least empty string
      } else {
        toggleStatus();
      }
    }

    function toggleStatus(remark) {
      const sheetName = document.getElementById('targetSheetName').value;
      const incident = allIncidents.find(i => i.sheetName === sheetName);
      if (!incident) return;
      
      const newStatus = incident.status === 'Active' ? 'Closed' : 'Active';
      showMessage('Updating status...', '');
      
      google.script.run.withSuccessHandler(function(updatedIncidents) {
        allIncidents = updatedIncidents;
        updateIncidentDropdown();
        showMessage('Status updated to ' + newStatus, 'success');
      }).toggleIncidentStatus(sheetName, newStatus, remark);
    }

    function refreshIncidents(callback) {
      google.script.run.withSuccessHandler(function(incidents) {
        allIncidents = incidents;
        updateIncidentDropdown();
        if (callback) callback();
      }).getIncidentsData();
    }

    function checkCurrentSheet() {
      google.script.run.withSuccessHandler(function(sheetName) {
        if (sheetName === currentActiveSheetName) return;
        currentActiveSheetName = sheetName;
        
        google.script.run.withSuccessHandler(function(isIncident) {
          if (isIncident) {
            // Check if we know about this incident yet
            if (!allIncidents.some(i => i.sheetName === sheetName)) {
              refreshIncidents(function() {
                const select = document.getElementById('targetSheetName');
                select.value = sheetName;
                updateStatusDisplay();
              });
            } else {
              const select = document.getElementById('targetSheetName');
              if (select.value !== sheetName) {
                select.value = sheetName;
                updateStatusDisplay();
              }
            }
            showMessage('', '');
          } else {
            // If not an incident sheet, don't necessarily clear the selection 
            // but maybe show a message if they try to submit.
          }
        }).isIncidentSheet(sheetName);
      }).getCurrentSheetName();
    }

    // Initial check
    checkCurrentSheet();
    
    // Check for sheet changes every 500ms
    setInterval(checkCurrentSheet, 500);
    
    // Refresh incident list every 10 seconds to catch new ones even if not switched to
    setInterval(refreshIncidents, 10000);

    document.getElementById('medical-form').onsubmit = function(e) {
      e.preventDefault();
      const sheetName = document.getElementById('targetSheetName').value;
      if (!sheetName) {
        showMessage('No target sheet selected.', 'error');
        return;
      }

      const incident = allIncidents.find(i => i.sheetName === sheetName);
      if (incident && incident.status !== 'Active') {
        if (!confirm('This incident is closed. Adding an entry will reopen it. Continue?')) {
          return;
        }
      }

      showMessage('Processing...', '');

      const offeredTransportElem = document.querySelector('input[name="offeredTransport"]:checked');
      const formData = {
        presided: document.getElementById('presided').value,
        offeredTransport: offeredTransportElem ? offeredTransportElem.value : '',
        transportWhy: document.getElementById('transportWhy').value,
        situation: document.getElementById('situation').value,
        actionsTaken: document.getElementById('actionsTaken').value,
        recommendations: document.getElementById('recommendations').value
      };

      google.script.run.withSuccessHandler(function() {
        showMessage('Entry added successfully!', 'success');
        if (incident && incident.status !== 'Active') {
            toggleStatus(); // Reopen if it was closed
        }
        resetActionLog();
      }).withFailureHandler(function(err) {
        showMessage('Error: ' + err.message, 'error');
      }).addEntryToIncident(sheetName, formData);
    };

    function showMessage(msg, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = msg;
      msgDiv.className = type;
    }

    function resetForm() {
      document.getElementById('medical-form').reset();
      showMessage('', '');
      checkCurrentSheet();
    }
    
    function resetActionLog() {
      const offeredTransportRadios = document.getElementsByName('offeredTransport');
      offeredTransportRadios.forEach(r => r.checked = false);
      document.getElementById('transportWhy').value = '';
      document.getElementById('transport-why-group').classList.add('hidden');
      document.getElementById('situation').value = '';
      document.getElementById('actionsTaken').value = '';
      document.getElementById('recommendations').value = '';
    }

    function toggleTransportWhy() {
      const offered = document.querySelector('input[name="offeredTransport"]:checked').value;
      const whyGroup = document.getElementById('transport-why-group');
      if (offered === 'No') {
        whyGroup.classList.remove('hidden');
      } else {
        whyGroup.classList.add('hidden');
        document.getElementById('transportWhy').value = '';
      }
    }
  </script>
</body>
</html>
